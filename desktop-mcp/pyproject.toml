[project]
name = "desktop-mcp"
version = "0.1.0"
description = "Cross-platform desktop control MCP server (mouse, keyboard, scroll, screenshots)"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0,<2",
  "pyautogui>=0.9.54",
  "pillow>=10.0",
  "pyperclip>=1.8.2",
]

[project.scripts]
desktop-mcp = "desktop_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["desktop_mcp*"]
