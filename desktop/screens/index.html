<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<title>Screen priority</title>
<style>
  :root,
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e100f;
    --raised: #171a18;
    --hover: #1e2220;
    --sunken: #090b0a;
    --line: #242925;
    --line-strong: #363d38;
    --fg: #e7ebe8;
    --dim: #a2aba5;
    --faint: #6c756f;
    --accent: #4af073;
    --accent-strong: #6ff78f;
    --accent-ink: #052310;
    --danger: #ff6f6f;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  header { padding: 16px 20px 10px; }

  h1 {
    margin: 0 0 4px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .hint {
    margin: 0;
    font-size: 12px;
    line-height: 1.45;
    color: var(--dim);
  }

  #canvas {
    position: relative;
    flex: 1;
    min-height: 120px;
    margin: 6px 20px 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--sunken);
    overflow: hidden;
  }

  .screen {
    position: absolute;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 2px;
    padding: 8px 10px;
    overflow: hidden;
    border: 1.5px solid var(--line-strong);
    border-radius: 10px;
    background: var(--raised);
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease;
  }

  .screen:hover { border-color: var(--faint); background: var(--hover); }

  .screen:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .screen[data-ranked] {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 9%, var(--raised));
  }

  .screen[data-ranked]:hover { border-color: var(--accent-strong); }

  .screen .badge {
    position: absolute;
    top: 7px;
    left: 10px;
    display: none;
    place-items: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 11px;
    font-weight: 700;
  }

  .screen[data-ranked] .badge { display: grid; }

  .screen .name,
  .screen .meta,
  .screen .plasma {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .screen .name { font-size: 12.5px; font-weight: 600; }
  .screen[data-ranked] .name { padding-left: 24px; }
  .screen .meta { font-size: 11px; color: var(--dim); }
  .screen .plasma { font-size: 10.5px; color: var(--faint); }

  .empty {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 20px;
    color: var(--dim);
    font-size: 12px;
    text-align: center;
  }

  footer {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px 16px;
  }

  .mirror {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--dim);
    cursor: pointer;
  }

  .mirror input {
    width: 14px;
    height: 14px;
    margin: 0;
    accent-color: var(--accent);
  }

  #status {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 12px;
    color: var(--dim);
  }

  #status[data-tone="error"] { color: var(--danger); }

  .btn {
    padding: 7px 14px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--raised);
    color: var(--fg);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
  }

  .btn:hover { background: var(--hover); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .btn.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
  }

  .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
</style>
</head>
<body>
  <header>
    <h1>Screen priority</h1>
    <p class="hint">Click the screens in the order you want them used. 1 is the main screen, where the window you are working in lands. Click a ranked screen again to drop it.</p>
  </header>

  <div id="canvas" role="group" aria-label="Connected screens"></div>

  <footer>
    <label class="mirror" title="Apply the same order in KScreen, so Plasma and KWin agree">
      <input type="checkbox" id="mirror"> Mirror to Plasma
    </label>
    <span id="status" role="status" aria-live="polite"></span>
    <button type="button" class="btn" id="reset">Reset</button>
    <button type="button" class="btn primary" id="close">Done</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
